<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>gil</title>
    <style>
      :root { color-scheme: light dark; }
      body { max-width: 520px; margin: 40px auto; padding: 0 20px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
      h1 { font-size: 18px; }
      form { display: flex; gap: 8px; margin: 16px 0 8px; }
      input { flex: 1; padding: 6px 10px; font: 13px ui-monospace, 'SF Mono', Menlo, monospace; }
      button { padding: 6px 14px; font: inherit; }
      .status.ok { color: #1a7f37; }
      .status.error { color: #cf222e; }
    </style>
  </head>
  <body>
    <h1>Pair with gil</h1>
    <p>
      Open gil's library window, click <strong>Chrome Extension</strong>, and copy the pairing
      code. gil must be running for captures to save.
    </p>
    <form>
      <input placeholder="Pairing code" autocomplete="off" spellcheck="false" />
      <button type="submit">Pair</button>
    </form>
    <div class="status"></div>
    <script src="options.js"></script>
  </body>
</html>
